<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help</title>
  <link rel="icon" href="../../icons/icon-32.png">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/app.css">
  <link rel="stylesheet" href="../kit.css">
</head>
<body class="app app-shell">
  <div class="app-toolbar">
    <span class="app-title">Help</span>
    <div class="tb-sep"></div>
    <div class="search-shell">
      <span data-icon="search" data-size="14"></span>
      <input class="ros-input" id="help-search" placeholder="Search shortcuts, apps and tips" aria-label="Search help">
    </div>
    <span class="ros-spacer"></span>
  </div>

  <div class="app-body pane" id="help-body"></div>

  <div class="app-status">
    <span>RadonOS 1.0 “Halogen” · offline-first</span>
    <span class="ros-spacer"></span>
    <span id="help-count"></span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
